name: Pengujian DUBESIA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pengujian Laravel dan Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, pdo_mysql, intl, zip, gd, bcmath
          coverage: none

      - name: Instal dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan konfigurasi pengujian
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instal dependensi frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Jalankan seluruh tes
        run: php artisan test --compact

  docker:
    name: Periksa Build Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Build image aplikasi
        run: docker build -t dubesia:ci .

      - name: Periksa skrip deployment
        run: |
          for script in docker/production/*.sh; do bash -n "$script"; done

      - name: Build image produksi
        run: docker build -f Dockerfile.production -t dubesia:production-ci .

      - name: Periksa konfigurasi Nginx dan entrypoint
        run: |
          docker run --rm --entrypoint nginx dubesia:production-ci -t
          docker run --rm --entrypoint sh dubesia:production-ci -n /usr/local/bin/production-entrypoint

      - name: Uji aplikasi produksi melalui Nginx dan PHP-FPM
        run: |
          cp .env.example "$RUNNER_TEMP/production.env"
          cat >> "$RUNNER_TEMP/production.env" <<'ENV'
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=false
          DB_CONNECTION=sqlite
          DB_DATABASE=/tmp/dubesia-ci.sqlite
          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          ENV
          docker run -d --name dubesia-smoke -p 127.0.0.1:8000:8080 \
            --mount "type=bind,source=$RUNNER_TEMP/production.env,target=/run/dubesia.env,readonly" \
            dubesia:production-ci
          trap 'docker logs dubesia-smoke; docker rm -f dubesia-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up; then ready=true; break; fi
            sleep 2
          done
          $ready
          docker exec dubesia-smoke sh -c 'touch /tmp/dubesia-ci.sqlite && chmod 666 /tmp/dubesia-ci.sqlite'
          docker exec dubesia-smoke php artisan migrate --force --no-interaction
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/login
